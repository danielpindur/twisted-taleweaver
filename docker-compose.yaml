services:
  postgres:
    image: postgres:18.1
    environment:
      POSTGRES_DB: twistedtaleweaver
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: SuperSecretPassword
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@twistedtaleweaver.com
      PGADMIN_DEFAULT_PASSWORD: SuperSecretPassword
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - postgres

  twistedtaleweaver-database:
    restart: no
    image: twistedtaleweaver.database
    build:
      context: .
      dockerfile: src/TwistedTaleweaver.Database/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env

  kafka:
    image: apache/kafka:4.1.1
    environment:
      # Broker identity
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # Listeners
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # Storage directory
      KAFKA_LOG_DIRS: /var/lib/kafka/data

      # KRaft cluster
      KAFKA_KRAFT_CLUSTER_ID: abcdefghijklmnopqrstuv
    volumes:
      - kafka_data:/var/lib/kafka/data
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      SERVER_PORT: 8443
    ports:
      - "8443:8443"

  twistedtaleweaver.gateway:
    image: twistedtaleweaver.gateway
    build:
      context: .
      dockerfile: src/TwistedTaleweaver.Gateway/Dockerfile
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      twistedtaleweaver-database:
        condition: service_completed_successfully
    env_file:
      - .env
      
volumes:
  postgres-data:
  pgadmin-data:
  kafka_data:
